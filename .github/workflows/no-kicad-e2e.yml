name: No-KiCad E2E

on:
  push:
  pull_request:

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Assert KiCad is not installed
        run: test -z "$(command -v kicad-cli || true)"
      - run: npm run e2e:no-kicad:portable

  managed-krt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - name: Assert KiCad is not installed
        run: test -z "$(command -v kicad-cli || true)"
      - run: npm run e2e:no-kicad:krt
      - run: npm run e2e:no-kicad:native
