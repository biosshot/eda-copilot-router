name: External-runtime independence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package-contract:
    name: Package and KiCad codec (no EDA runtime)
    runs-on: ubuntu-latest
    env:
      KICAD_CLI: /not-installed/kicad-cli
      KICAD_PYTHON: /not-installed/kicad-python
      COPILOT_ROUTER_PYTHON: /not-installed/python
      COPILOT_ROUTER_KRT_DIR: /not-installed/krt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Assert no native EDA or sibling projects
        run: |
          test -z "$(command -v kicad-cli || true)"
          test ! -e ../kicad-copilot
          test ! -e ../easyeda-copilot
          test ! -e ../KiCadRoutingTools
      - run: npm test

  portable-routing:
    name: Portable routing (no KRT, KiCad, or Python)
    runs-on: ubuntu-latest
    env:
      KICAD_CLI: /not-installed/kicad-cli
      KICAD_PYTHON: /not-installed/kicad-python
      COPILOT_ROUTER_PYTHON: /not-installed/python
      COPILOT_ROUTER_KRT_DIR: /not-installed/krt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Assert no routing/native runtime
        run: |
          test -z "$(command -v kicad-cli || true)"
          test ! -e ../kicad-copilot
          test ! -e ../easyeda-copilot
          test ! -e ../KiCadRoutingTools
      - run: npm run e2e:no-kicad:portable

  polygon-routing:
    name: Polygon planning on real boards (no KRT or KiCad)
    runs-on: ubuntu-latest
    env:
      KICAD_CLI: /not-installed/kicad-cli
      KICAD_PYTHON: /not-installed/kicad-python
      COPILOT_ROUTER_PYTHON: /not-installed/python
      COPILOT_ROUTER_KRT_DIR: /not-installed/krt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Assert no routing/native runtime
        run: |
          test -z "$(command -v kicad-cli || true)"
          test ! -e ../kicad-copilot
          test ! -e ../easyeda-copilot
          test ! -e ../KiCadRoutingTools
      - run: npm run e2e:no-kicad:polygon

  managed-krt:
    name: Managed KRT and packed CLI (no KiCad or KRT checkout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Select isolated router cache
        run: echo "COPILOT_ROUTER_CACHE_DIR=$RUNNER_TEMP/copilot-router-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: npm ci
      - name: Assert no KiCad, sibling project, local KRT, or warm router cache
        run: |
          test -z "$(command -v kicad-cli || true)"
          test ! -e ../kicad-copilot
          test ! -e ../easyeda-copilot
          test ! -e ../KiCadRoutingTools
          test -z "${COPILOT_ROUTER_KRT_DIR:-}"
          test ! -e "$COPILOT_ROUTER_CACHE_DIR/backends/krt/0.21.3"
      - run: npm run e2e:no-kicad:krt
      - name: Assert managed KRT was installed into the isolated cache
        run: test -e "$COPILOT_ROUTER_CACHE_DIR/backends/krt/0.21.3"
      - run: npm run e2e:no-kicad:native
      - run: npm run e2e:no-kicad:packed

  managed-krt-windows:
    name: Managed KRT and packed CLI on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Select isolated router cache
        shell: pwsh
        run: '"COPILOT_ROUTER_CACHE_DIR=$env:RUNNER_TEMP/copilot-router-cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: npm ci
      - name: Assert no KiCad, sibling project, local KRT, or warm router cache
        shell: pwsh
        run: |
          if (Get-Command kicad-cli -ErrorAction SilentlyContinue) { throw "kicad-cli must be absent" }
          foreach ($sibling in @("../kicad-copilot", "../easyeda-copilot", "../KiCadRoutingTools")) {
            if (Test-Path -LiteralPath $sibling) { throw "Unexpected sibling project: $sibling" }
          }
          if ($env:COPILOT_ROUTER_KRT_DIR) { throw "COPILOT_ROUTER_KRT_DIR must be unset" }
          $managed = Join-Path $env:COPILOT_ROUTER_CACHE_DIR "backends/krt/0.21.3"
          if (Test-Path -LiteralPath $managed) { throw "Managed KRT cache must start empty" }
      - run: npm run e2e:no-kicad:krt
      - name: Assert managed KRT was installed into the isolated cache
        shell: pwsh
        run: |
          $managed = Join-Path $env:COPILOT_ROUTER_CACHE_DIR "backends/krt/0.21.3"
          if (-not (Test-Path -LiteralPath $managed)) { throw "Managed KRT was not cached" }
      - run: npm run e2e:no-kicad:native
      - run: npm run e2e:no-kicad:packed
